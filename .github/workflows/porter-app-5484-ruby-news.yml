"on":
    push:
        branches:
            - main
name: Deploy to ruby-news
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: ruby-news
                PORTER_CLUSTER: "5484"
                PORTER_DEPLOYMENT_TARGET_ID: bb2b9f2b-7dac-4a63-baed-bd9c06451e42
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "17928"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_17928_30214 }}
